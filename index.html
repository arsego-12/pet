
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet ARSEGO</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="nome">
            <span class="n1">Animal de Estimação</span>
            <span class="n2">ARS</span>
        </div>

        <nav>
            <ul>
                <li>
                    <a href="index.html" class="link-menu">Página Inicial</a>
                </li>
                <li>
                    <a href="#sobre" class="link-menu">Sobre</a>
                </li>
                <li>
                    <a href="servicos.html" class="link-menu">Serviços</a>
                </li>
                <li>
                    <a href="#contato" class="link-menu">Contato</a>
                </li>
            </ul>
        </nav>

        <button class="botao-login">Entrar</button>
    </header>

    <main>
        <section id="sobre">
            <img
                src="./img/3f9e624eeae8f2679e076b3620c508e7.jpg"
                alt="Logo do pet shop"
                class="logo">

            <div class="texto">
                <h1 class="titulo">NÓS CUIDAMOS</h1>
                <h2 class="sub-titulo">Do seu pet</h2>

                <p class="paragrafo">
                    Oferecemos todo o carinho e a dedicação que o seu
                    melhor amigo merece. Cuidamos da saúde e do bem-estar
                    do seu pet com profissionais talentosos e muito amor.
                </p>

                <button
                    class="botao-explore"
                    onclick="imageApi()">
                    Explorar
                </button>
            </div>

            <div class="dogs-div">
                <img src="" alt="Cachorro" class="img-dog">
            </div>
        </section>
    </main>

    <footer id="contato">
        <p>&copy; 2026 ARSEGO Veterinário</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
